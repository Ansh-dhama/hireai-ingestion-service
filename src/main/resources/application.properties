# Server Configuration
server.port=8081
server.shutdown=graceful

# Spring Application Configuration
spring.application.name=hireai-ingestion-service
spring.threads.virtual.enabled=true

# Servlet Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hireai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YourNewStrongPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Configuration
spring.datasource.hikari.pool-name=IngestionHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Configuration (Fixed for MySQL)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
hireai.flyway.repair-once=true
logging.level.org.flywaydb=DEBUG

# Custom GitHub API Configuration
github.api.base-url=https://api.github.com
github.api.token=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

# Springdoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.servlet.context-path=/app

# Phase 2: Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Phase 2: UTC timestamps for leases and retries
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Phase 2: Extraction workers
hireai.extraction.enabled=true
hireai.extraction.workers=4
hireai.extraction.max-attempts=3
hireai.extraction.lease-seconds=90

# Phase 2: Repository and file limits
hireai.extraction.max-repositories=3
hireai.extraction.max-files-per-repository=5
hireai.extraction.max-total-bytes=122880
hireai.extraction.max-file-bytes=65536

# Phase 2: GitHub request limits
hireai.extraction.max-requests=80
hireai.extraction.max-tree-requests=20
hireai.extraction.request-timeout-seconds=12
hireai.extraction.token-capacity=80
hireai.extraction.token-refill-per-second=1.3333333333
hireai.extraction.provider-concurrency=8

# Phase 2: Redis Streams
hireai.extraction.stream=stream:candidate:extraction
hireai.extraction.dlq-stream=stream:candidate:extraction:dlq
hireai.extraction.group=cg-extraction-workers

# Phase 2: Application access token expiry
hireai.extraction.access-token-hours=168